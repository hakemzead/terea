<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ episode.title }}</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #141414; color: #fff; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #e50914; font-size: 24px; }
        .video-container { margin: 20px auto; max-width: 900px; }
        
        .servers-box { margin-top: 20px; }
        .server-btn { background-color: #333; color: white; border: none; padding: 10px 20px; margin: 5px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .server-btn:hover { background-color: #e50914; }

        .nav-buttons { margin: 25px 0; display: flex; justify-content: center; gap: 15px; }
        .nav-btn { background-color: #222; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; border: 1px solid #444; }
        .nav-btn:hover { background-color: #e50914; }
        .disabled-btn { background-color: #1a1a1a; color: #555; border-color: #2a2a2a; pointer-events: none; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>{{ episode.title }}</h1>
    <p>مشاهدة مباشرة للسيرفر المختار</p>

    <!-- حاوية عرض السيرفر الخارجي داخل الصفحة مباشرة -->
    <div class="video-container">
        <iframe id="serverFrame" src="" width="100%" height="500px" style="border: none; border-radius: 8px; background: #000;" allowfullscreen></iframe>
    </div>

    <!-- أزرار اختيار السيرفرات -->
    <div class="servers-box">
        <p style="font-size: 14px; color: #aaa;">اختر السيرفر للمشاهدة:</p>
        {% for server_name, server_url in episode.servers.items() %}
            <button class="server-btn" onclick="loadServer('{{ server_url }}')">
                📺 {{ server_name }}
            </button>
        {% endfor %}
    </div>

    <!-- أزرار التنقل بين الحلقات -->
    <div class="nav-buttons">
        {% if prev_id %}
            <a href="/watch/{{ prev_id }}" class="nav-btn">← الحلقة السابقة</a>
        {% else %}
            <a href="#" class="nav-btn disabled-btn">← الحلقة السابقة</a>
        {% endif %}
        
        {% if next_id %}
            <a href="/watch/{{ next_id }}" class="nav-btn">الحلقة التالية →</a>
        {% else %}
            <a href="#" class="nav-btn disabled-btn">الحلقة التالية →</a>
        {% endif %}
    </div>

    <script>
        function loadServer(url) {
            document.getElementById('serverFrame').src = url;
        }

        window.onload = function() {
            // تحميل أول سيرفر متوفر تلقائياً عند فتح الصفحة
            const firstUrl = "{{ episode.servers.values()|first if episode.servers else '' }}";
            if (firstUrl) {
                document.getElementById('serverFrame').src = firstUrl;
            }
        };
    </script>

</body>
</html>
