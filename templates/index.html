<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terea</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #141414; color: #fff; margin: 0; padding: 0; }
        
        /* شريط علوي شبيه بمواقع البث */
        .header-bar { background-color: #1f1f1f; padding: 20px; text-align: center; border-bottom: 3px solid #e50914; }
        h1 { color: #e50914; margin: 0 0 10px 0; font-size: 28px; }
        
        /* أزرار الأقسام */
        .categories { margin: 15px 0; }
        .cat-btn { background-color: #333; color: #fff; border: none; padding: 8px 18px; margin: 0 4px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .cat-btn:hover, .cat-btn.active { background-color: #e50914; }

        /* صندوق البحث */
        .search-container { margin: 15px 0; }
        .search-input { width: 100%; max-width: 350px; padding: 10px 20px; font-size: 14px; border-radius: 20px; border: 1px solid #444; background-color: #222; color: #fff; outline: none; }
        .search-input:focus { border-color: #e50914; }

        /* شبكة عرض البوسترات (Grid) */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        
        /* تصميم البطاقة الواحدة */
        .card { background-color: #1f1f1f; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: 0.3s; text-decoration: none; color: #fff; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-8px); box-shadow: 0 8px 20px rgba(229,9,20,0.4); }
        
        .card-img { width: 100%; height: 280px; object-fit: cover; }
        .card-body { padding: 15px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 16px; font-weight: bold; margin: 0 0 10px 0; color: #fff; }
        .card-tag { font-size: 12px; color: #e50914; background: rgba(229,9,20,0.1); padding: 4px 8px; border-radius: 4px; display: inline-block; align-self: center; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>Terea</h1>
        <p style="color: #aaa; margin: 0 0 15px 0;">اختر القسم أو ابحث عن العمل المفضّل لديك:</p>
        
        <!-- أزرار الأقسام -->
        <div class="categories">
            <button class="cat-btn active" onclick="filterCategory('all', this)">الكل</button>
            <button class="cat-btn" onclick="filterCategory('series', this)">مسلسلات</button>
            <button class="cat-btn" onclick="filterCategory('movies', this)">أفلام</button>
            <button class="cat-btn" onclick="filterCategory('dubbed', this)">مسلسلات مدبلجة</button>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن اسم العمل..." onkeyup="filterShows()">
        </div>
    </div>

    <!-- شبكة العرض -->
    <div class="container">
        <div class="grid" id="showsGrid">
            {% for id, show in shows.items() %}
                <a href="/series/{{ id }}" class="card" data-title="{{ show.title }}" data-category="{{ show.category }}">
                    <img src="{{ show.image }}" alt="{{ show.title }}" class="card-img">
                    <div class="card-body">
                        <h3 class="card-title">{{ show.title }}</h3>
                        <span class="card-tag">
                            {% if show.category == 'series' %}مسلسل{% elif show.category == 'movies' %}فيلم{% else %}مدبلج{% endif %}
                        </span>
                    </div>
                </a>
            {% endfor %}
        </div>
    </div>

    <script>
        let currentCategory = 'all';

        function filterCategory(category, button) {
            currentCategory = category;
            let buttons = document.getElementsByClassName('cat-btn');
            for (let btn of buttons) {
                btn.classList.remove('active');
            }
            button.classList.add('active');
            filterShows();
        }

        function filterShows() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title').toLowerCase();
                let category = cards[i].getAttribute('data-category');
                
                let matchesCategory = (currentCategory === 'all' || category === currentCategory);
                let matchesSearch = title.includes(input);

                if (matchesCategory && matchesSearch) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
